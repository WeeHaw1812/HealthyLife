<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kế hoạch ăn uống - HealthyLife</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>


    <header class="header">

        <div class="container nav">

            <a href="dashboard.html" class="logo">
                🥗 HealthyLife
            </a>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="bmi.html">
                    BMI
                </a>

                <a href="meals.html">
                    Món ăn
                </a>

                <a href="plan.html">
                    Kế hoạch
                </a>

                <a href="statistics.html">
                    Thống kê
                </a>
                <a href="favorite.html">
                    Yêu thích
                </a>
            </nav>

        </div>

    </header>


    <main>

        <section class="section">

            <div class="container">

                <div class="section-title">

                    <span>MEAL PLAN</span>

                    <h1>
                        📅 Kế hoạch ăn uống
                    </h1>

                    <p>
                        Thiết lập thời gian ăn và thời gian
                        duy trì chế độ.
                    </p>

                </div>


                <div class="plan-grid">


                    <div class="card">

                        <h2>
                            ⏰ Giờ ăn
                        </h2>


                        <form id="reminderForm">


                            <div class="form-group">

                                <label>
                                    🍳 Bữa sáng
                                </label>

                                <input type="time" id="breakfastTime" value="07:00">

                            </div>


                            <div class="form-group">

                                <label>
                                    🍱 Bữa trưa
                                </label>

                                <input type="time" id="lunchTime" value="12:00">

                            </div>


                            <div class="form-group">

                                <label>
                                    🍲 Bữa tối
                                </label>

                                <input type="time" id="dinnerTime" value="18:30">

                            </div>


                            <button class="btn btn-primary full">
                                💾 Lưu giờ ăn
                            </button>

                        </form>

                    </div>


                    <div class="card">

                        <h2>
                            📅 Thời gian duy trì
                        </h2>


                        <div class="form-group">

                            <label>
                                Số tuần
                            </label>

                            <select id="duration">

                                <option value="2">
                                    2 tuần
                                </option>

                                <option value="4">
                                    4 tuần
                                </option>

                                <option value="8">
                                    8 tuần
                                </option>

                                <option value="12">
                                    12 tuần
                                </option>

                            </select>

                        </div>


                        <button id="savePlan" class="btn btn-primary full">
                            📋 Lưu kế hoạch
                        </button>


                        <div id="planResult" class="plan-result">
                            Chưa có kế hoạch.
                        </div>

                    </div>

                </div>


                <div class="card reminder-card">

                    <h2>
                        🔔 Lịch ăn hôm nay
                    </h2>

                    <div id="reminderList"></div>

                </div>

            </div>

        </section>

    </main>


    <script src="../js/reminder.js"></script>

</body>

</html>
